function vEvolucao(){
  if(V.log)return vLog();
  const hj=hoje(),ss=[...S.sessoes].sort((a,b)=>b.data.localeCompare(a.data));
  const semana=i=>{const fim=addD(hj,-7*i),ini=addD(fim,-6);return S.sessoes.filter(s=>s.data>=ini&&s.data<=fim)};
  const ua=[],cnt=[],lab=[];for(let i=7;i>=0;i--){const x=semana(i);ua.push(Math.round(x.reduce((s,y)=>s+(+y.pse||0)*(+y.dur||0),0)));cnt.push(x.length);lab.push(i?'-'+i+'s':'Atual')}
  const a=ua[7],b=ua[6],s28=S.sessoes.filter(s=>diff(s.data,hj)>=0&&diff(s.data,hj)<28),pse=s28.length?(s28.reduce((s,x)=>s+(+x.pse||0),0)/s28.length).toFixed(1):'–';
  const saltos=b>0&&a>b*1.5;
  const exs=uniq(S.sessoes.flatMap(s=>(s.itens||[]).filter(i=>i.sets.some(x=>+x.carga>0)).map(i=>i.exId))).filter(i=>BYID[i]);
  const sel=V.evEx&&exs.includes(V.evEx)?V.evEx:exs[0]||'';
  const pts=sel?[...S.sessoes].sort((x,y)=>x.data.localeCompare(y.data)).map(s=>{const it=(s.itens||[]).find(i=>i.exId===sel);const c=it?Math.max(0,...it.sets.map(x=>+x.carga||0)):0;return c>0?{d:s.data,y:c}:null}).filter(Boolean):[];
  return `<header class="top"><div><div class="brand">Evolução</div><h1>Histórico e progresso</h1></div><button class="btn p" data-a="logFree">Registrar sessão</button></header>
  <div class="kpis"><div class="kpi"><b>${s28.length}</b><span>sessões em 28 dias</span></div><div class="kpi"><b>${pse}</b><span>esforço médio (PSE 1–10)</span></div><div class="kpi"><b>${a}</b><span>carga desta semana (UA)</span></div></div>
  ${saltos?`<div class="notice" style="margin-top:12px"><b>Atenção.</b> A carga desta semana subiu mais de 50% sobre a anterior. Aumentos bruscos elevam o risco de lesão; considere reduzir.</div>`:''}
  <h2>Carga por semana</h2><div class="card">${bars(ua,lab,'carga em unidades arbitrárias')}<p class="xs mut" style="margin:6px 0 0">Carga = esforço percebido (PSE) × duração em minutos. Sessões por semana: ${cnt.join(' · ')}.</p></div>
  <h2>Progressão de carga</h2><div class="card">${exs.length?`<label class="f" for="evx">Exercício</label><select id="evx" class="in">${exs.map(i=>`<option value="${i}" ${i===sel?'selected':''}>${esc(BYID[i].nome)}</option>`).join('')}</select><div style="margin-top:10px">${linha(pts)}</div><p class="xs mut" style="margin:6px 0 0">Maior carga por sessão (kg).</p>`:`<p class="mut" style="margin:0">Registre sessões com carga para ver a progressão de cada exercício.</p>`}</div>
  <h2>Sessões registradas</h2>${ss.length?`<div class="grid" style="grid-template-columns:1fr">${ss.slice(0,40).map(s=>`<article class="card"><div class="row sp"><div class="grow"><b>${esc(s.nome)}</b> ${s.exemplo?'<span class="tag">Exemplo</span>':''}<div class="sm mut">${wd(s.data)} ${fmt(s.data)} · ${s.dur} min · PSE ${s.pse}</div></div><div class="row">${tagInt(s.nivel||'baixa')}<button class="btn s d" data-a="delS" data-id="${s.id}" aria-label="Excluir sessão de ${fmt(s.data)}">Excluir</button></div></div>
  ${(s.itens||[]).length?`<p class="sm mut" style="margin:8px 0 0">${esc(s.itens.map(i=>{const c=Math.max(0,...i.sets.map(x=>+x.carga||0));return (BYID[i.exId]?.nome||i.exId)+(c?' ('+c+' kg)':'')}).join(', '))}</p>`:''}${s.obs?`<p class="sm" style="margin:6px 0 0">${esc(s.obs)}</p>`:''}</article>`).join('')}</div>`:`<div class="empty"><p>Nenhuma sessão ainda.</p><p class="sm">Registre uma sessão ou carregue dados de exemplo em Perfil.</p></div>`}`}

    if(d.id){const k=S.treinos.findIndex(x=>x.id===d.id);d.exemplo=false;S.treinos[k]=d}else{d.id=uid();S.treinos.push(d)}salvar();V.draft=null;render();toast('Treino salvo')},
  cancelDraft(){V.draft=null;render()},
  logT(d){const t=S.treinos.find(x=>x.id===d.id);V.log={treinoId:t.id,nome:t.nome,data:hoje(),dur:Math.max(20,minTreino(t)),pse:6,obs:'',itens:t.itens.map(i=>({exId:i.exId,plan:i.series+' × '+i.alvo,sets:Array.from({length:Math.max(1,+i.series||1)},()=>({reps:'',carga:''}))}))};logNivel();V.tab='evolucao';fechaTudo();V.gq='';render();scrollTo(0,0)},
  logFree(){V.log={treinoId:null,nome:'Sessão livre',data:hoje(),dur:60,pse:6,obs:'',itens:[]};logNivel();render();scrollTo(0,0)},
  cancelLog(){V.log=null;render()},
  saveLog(){const L=V.log;logNivel();const s={id:uid(),treinoId:L.treinoId,nome:L.nome,data:L.data,dur:Math.max(1,+L.dur||60),pse:+L.pse,nivel:L.nivel,obs:L.obs.trim(),itens:L.itens.map(i=>({exId:i.exId,sets:i.sets.filter(x=>x.reps!==''||x.carga!=='').map(x=>({reps:x.reps,carga:String(x.carga).replace(',','.')}))}))};
    S.sessoes.push(s);salvar();V.log=null;render();toast('Sessão registrada')},
  delS(d){conf('Excluir sessão?','O registro será removido do histórico e dos gráficos.',()=>{S.sessoes=S.sessoes.filter(x=>x.id!==d.id);salvar();toast('Sessão excluída')})},
  addJogo(){const d=$('#jd').value;if(!d){toast('Escolha a data do jogo');return}S.jogos.push({id:uid(),data:d,rotulo:$('#jr').value.trim()});salvar();render();toast('Jogo adicionado')},
  rmJogo(d){S.jogos=S.jogos.filter(x=>x.id!==d.id);salvar();render()},
  loadEx(){S.sessoes=S.sessoes.filter(s=>!s.exemplo);const hj=hoje(),off=[33,31,28,26,24,21,19,17,14,12,10,7,5,3],base={FOR01:60,FOR02:50,FOR03:16,FOR07:70};
    const ts=S.treinos.slice(0,4);if(!ts.length){toast('Restaure os treinos de exemplo primeiro');return}
    off.forEach((o,k)=>{const t=ts[k%ts.length],w=Math.floor((33-o)/7),pse=[5,6,7,6,8,6,5][k%7];
      S.sessoes.push({id:uid(),exemplo:true,treinoId:t.id,nome:t.nome,data:addD(hj,-o),dur:[55,60,65,50][k%4],pse,nivel:maxN(nivelTreino(t),pse>=8?'alta':pse>=6?'moderada':'baixa'),obs:'',
        itens:t.itens.map(i=>{const b=base[i.exId],r=parseInt(i.alvo)||'';return {exId:i.exId,sets:Array.from({length:+i.series||1},()=>({reps:r,carga:b?String(b+w*2.5):''}))}})})});
    salvar();render();toast('Histórico de exemplo carregado')},
  rmEx(){S.sessoes=S.sessoes.filter(s=>!s.exemplo);salvar();render();toast('Exemplos removidos')},
  resetT(){const n=seed().treinos;S.treinos=S.treinos.filter(t=>!t.exemplo).concat(n);salvar();render();toast('Treinos de exemplo restaurados')},
  exp(){$('#bk').value=JSON.stringify(S)},
  async copiar(){const t=$('#bk');if(!t.value)t.value=JSON.stringify(S);t.select();try{await navigator.clipboard.writeText(t.value);toast('Backup copiado')}catch(e){toast('Selecione e copie o texto manualmente')}},
  imp(){try{const o=JSON.parse($('#bk').value);if(!o||!Array.isArray(o.treinos)||!Array.isArray(o.sessoes))throw 0;S=o;normS();salvar();render();toast('Dados importados')}catch(e){toast('Texto de backup inválido')}},
  resetAll(){conf('Apagar todos os dados?','Treinos, sessões, favoritos e perfil deste aparelho serão removidos. Isso não pode ser desfeito.',()=>{S=seed();normS();salvar();V.draft=null;V.log=null;toast('Dados apagados')})},
  pniv(d){S.plano.nivel=+d.v;salvar();render()},
  ploc(d){S.plano.local=d.v;salvar();render()},
  art(d){V.art=+d.i;render();scrollTo(0,0)},
  artX(){V.art=null;render()},
  guiaT(d){iniciarGuia(S.treinos.find(x=>x.id===d.id))},
  guiaPl(d){const t=planoTreino(d.v,+d.d);if(!S.treinos.some(x=>x.id===t.id)){S.treinos.push(t);salvar()}iniciarGuia(S.treinos.find(x=>x.id===t.id))},
  gSair(){conf('Sair do treino?','As séries marcadas neste treino serão descartadas.',()=>{gStop();V.guia=null})},
  gTimer(){const it=V.guia.itens[V.guia.i];if(gIv){gStop();$('#gtm').textContent=mmss(it.descanso);$('#gtl').textContent='descanso'}else gStart(it.descanso)},
  gSerie(){const it=V.guia.itens[V.guia.i];it.sets.push({reps:$('#gr').value.trim()||(parseInt(it.alvo)||''),carga:$('#gk').value.trim().replace(',','.')});$('#gsd').textContent=it.sets.length+'/'+it.series;if(it.sets.length>=it.series)toast('Séries concluídas. Avance para o próximo exercício.');gStart(it.descanso)},
  gNav(d){const G=V.guia,j=G.i+ +d.d;gStop();if(j<0)return;if(j>=G.itens.length){V.log={treinoId:G.treinoId,nome:G.nome,data:hoje(),dur:Math.max(1,Math.round((Date.now()-G.t0)/60000)),pse:6,obs:'',itens:G.itens.map(i=>({exId:i.exId,plan:i.series+' × '+i.alvo,sets:i.sets.length?i.sets:Array.from({length:i.series},()=>({reps:'',carga:''}))}))};logNivel();V.guia=null;V.tab='evolucao';render();scrollTo(0,0);toast('Confira o esforço e salve a sessão');return}G.i=j;render();const o=$('.overlay');o&&o.scrollTo(0,0)},
  skip(){if(V.splash){V.splash=false;render()}},
  visit(){S.user={nome:'Visitante',email:''};salvar();V.tab='inicio';render()},
  sair(){conf('Sair do perfil?','Seus treinos e registros continuam guardados neste aparelho.',()=>{S.user=null;salvar();V.tab='inicio'})},
  ppos(d){V.ppos=d.v;render()},
  savePl(d){const t=planoTreino(d.v,+d.d);if(!S.treinos.some(x=>x.id===t.id)){S.treinos.push(t);salvar()}render();toast('Treino salvo em Meus treinos')},
  logPl(d){const t=planoTreino(d.v,+d.d);if(!S.treinos.some(x=>x.id===t.id)){S.treinos.push(t);salvar()}A.logT({id:t.id})},
  calMeta(){const v=Math.round(+$('#cm').value);if(!(v>=800&&v<=6000)){toast('Informe uma meta entre 800 e 6000 kcal');return}S.cal.meta=v;salvar();render();toast('Meta atualizada')},
  copo(d){const x=calDia(hoje()),i=+d.i;x.w=i+1===x.w?i:i+1;salvar();render()},
  addRef(){const k=Math.round(parseFloat($('#rk').value));if(!(k>0)){toast('Informe as calorias');$('#rk').focus();return}const t=$('#rt').value;calDia(hoje()).m.push({t,n:$('#rn').value.trim()||t,k});salvar();render();toast('Refeição adicionada')},
  rmRef(d){calDia(hoje()).m.splice(+d.i,1);salvar();render()},
  okConf(){const f=V.confirm.ok;V.confirm=null;f();render()},
  noConf(){V.confirm=null;render()}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const f=A[b.dataset.a];if(f)f(b.dataset)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(V.confirm)A.noConf();else if(V.addTo)A.fecharAdd();else if(V.det)A.fechar()}});
document.addEventListener('submit',e=>{if(e.target.id!=='lf')return;e.preventDefault();const n=$('#ln').value.trim(),m=$('#le').value.trim(),er=$('#lerr');let msg='';if(n.length<2)msg='Informe seu nome com pelo menos 2 letras.';else if(m&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m))msg='Confira o e-mail ou deixe o campo vazio.';if(msg){er.textContent=msg;er.hidden=false;(n.length<2?$('#ln'):$('#le')).focus();return}S.user={nome:n,email:m};salvar();V.tab='inicio';render();toast('Bem-vindo, '+n)});
V.splash=true;render();setTimeout(()=>{if(V.splash){V.splash=false;render()}},matchMedia('(prefers-reduced-motion:reduce)').matches?700:2100);
</script>

</body></html>
